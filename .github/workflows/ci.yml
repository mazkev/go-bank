name: Go Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test_and_build:
    name: Test & Build Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Verify Go Modules
      run: go mod verify

    - name: Run Unit & Integration Tests (With Race Detector)
      run: go test -v -race ./...

    - name: Build Production Executable Binary
      run: go build -v -o bank-api .
